# market-orders.yml — v1.1 — Last updated 2026-08-07
#
# v1.1: the sweep also publishes jitaDepth.json (20 price levels per side), and
# a second step narrows the book to reproCandidates.json. Both exist because
# Apps Script gets 6 minutes per execution: sizing a reprocessing trade needs a
# ladder walk per candidate and a bid ladder per output material, which does not
# fit over 18.8k types but fits easily over a few hundred.
#
# Hourly sweep of Jita 4-4's order book, published as compact JSON for the
# EVE PI Manager v2 Apps Script to import in a single fetch.
#
# Cadence: ESI regenerates this data every 300s, but GitHub's schedule has a
# 5-minute floor and does not guarantee on-time execution (runs are routinely
# delayed 10-20 minutes at peak). Anything under ~15 minutes is unreliable no
# matter what the cron says, so hourly is the honest cadence — and structural
# trading opportunities do not move meaningfully within an hour. Use
# workflow_dispatch when you want it now.
#
# The :07 offset is deliberate: crons scheduled on the hour are the most
# heavily contended and the most delayed.
#
# Published to an ORPHAN `data` branch, force-pushed, so the history stays at
# exactly one commit. Committing ~0.8MB hourly to master would add roughly 7GB
# of git objects a year.

name: Refresh Jita orders

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-publish
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Bring the previously published files across so the history data written
      # by the daily job survives an hourly order refresh.
      - name: Fetch current published data
        run: |
          git fetch origin data --depth=1 || echo "no data branch yet — first run"
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout origin/data -- market/ || true
          fi
          ls -la market/ 2>/dev/null || echo "(no existing market/)"

      - name: Sweep orders
        # pi_orders_archive.py runs sweep_orders.main() unchanged and also
        # writes archive/orders/YYYY/MM/DD/HH.json.gz from the same pages.
        run: python3 pi_orders_archive.py

      # Reads the snapshot just written plus the SDE slice from the sibling
      # repo. A failure here fails the job before the publish step, which is
      # deliberate: a fresh snapshot beside a stale candidate list would send
      # the sheet after types whose prices have already moved.
      - name: Build reprocessing candidates
        run: python3 build_repro_candidates.py

      - name: Publish to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publish
          git reset
          git add -f market/
          git commit -m "Jita orders $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin publish:data

      # Appends this hour's PI order dump to the append-only `pi-orders-archive`
      # branch (plain fast-forward push, NEVER forced; no secrets beyond the
      # job's own GITHUB_TOKEN). Runs after the data publish and cannot fail the
      # job: the snapshot is already out, and a missed hour is a gap, not damage.
      - name: Append PI orders to archive branch
        continue-on-error: true
        run: |
          set -e
          f=$(find archive/orders -name '*.json.gz' -type f | head -n 1)
          [ -n "$f" ] || { echo "no archive file this run"; exit 0; }
          rel=${f#archive/}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/arch"
            git worktree prune
            git worktree add --detach "$RUNNER_TEMP/arch" HEAD
            if git fetch origin pi-orders-archive --depth=1; then
              git -C "$RUNNER_TEMP/arch" checkout -q --detach FETCH_HEAD
            else
              echo "no pi-orders-archive branch yet — creating orphan"
              git -C "$RUNNER_TEMP/arch" checkout -q --orphan pi-orders-archive-new
              git -C "$RUNNER_TEMP/arch" rm -rfq .
            fi
            mkdir -p "$RUNNER_TEMP/arch/$(dirname "$rel")"
            cp "$f" "$RUNNER_TEMP/arch/$rel"
            git -C "$RUNNER_TEMP/arch" add "$rel"
            if git -C "$RUNNER_TEMP/arch" diff --cached --quiet; then
              echo "archive file unchanged"; exit 0
            fi
            git -C "$RUNNER_TEMP/arch" commit -q -m "PI orders $(date -u +%Y-%m-%dT%H:%MZ)"
            if git -C "$RUNNER_TEMP/arch" push origin HEAD:refs/heads/pi-orders-archive; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), refetching"
          done
          exit 1

# End of market-orders.yml
